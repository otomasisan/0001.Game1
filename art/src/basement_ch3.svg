      <circle cx="60" cy="40" r="3" fill="#F7DD8A"/>
      <g fill="#C9DDB0" opacity="0.8"><circle cx="30" cy="95" r="3"/><circle cx="90" cy="95" r="3"/></g>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8D4EE"/><stop offset="1" stop-color="#E4F2F7"/>
    </linearGradient>
    <clipPath id="glass"><rect x="160" y="280" width="320" height="280"/></clipPath>
    <radialGradient id="sunlight" cx="0.2" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#FFF6D8" stop-opacity="0.55"/><stop offset="1" stop-color="#FFF6D8" stop-opacity="0"/>
    </radialGradient>
  </defs>

