<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- ひつじのおるすばん / ポッポ(ハト時計の鳥・ばねつき・右向き) -->
  <defs>
    <filter id="wobble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="feather" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#C6D4E2"/><stop offset="1" stop-color="#93A8BE"/>
    </radialGradient>
    <radialGradient id="belly" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#FFF8EA"/><stop offset="1" stop-color="#F1E3CC"/>
    </radialGradient>
  </defs>
  <g filter="url(#wobble)" stroke="#5A4636" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- ばね と 台 -->
    <path d="M200 300 q-30 8 0 16 q30 8 0 16 q-30 8 0 16 q30 8 0 16" fill="none" stroke-width="6"/>
    <rect x="150" y="360" width="100" height="22" rx="8" fill="#9C6B47"/>
    <!-- しっぽ -->
    <path d="M118 236 L60 206 L70 238 L52 262 L118 262 Z" fill="#7F95AD"/>
    <!-- からだ -->
    <ellipse cx="196" cy="222" rx="96" ry="82" fill="url(#feather)"/>
    <ellipse cx="226" cy="246" rx="58" ry="54" fill="url(#belly)"/>
    <!-- つばさ -->
    <path d="M128 206 q40 -30 90 6 q-20 52 -70 46 q-26 -20 -20 -52 Z" fill="#8299B2"/>
    <g fill="none" stroke-width="3" opacity="0.6"><path d="M150 226 q24 6 44 -6"/><path d="M156 244 q20 4 36 -6"/></g>
    <!-- あたま -->
    <circle cx="258" cy="146" r="56" fill="url(#feather)"/>
    <path d="M250 92 q6 -28 22 -26 q-8 10 -4 26" fill="#93A8BE"/>
    <!-- くちばし -->
    <path d="M308 140 L344 152 L308 166 Z" fill="#F2B25C"/>
  </g>
  <!-- かお -->
  <circle cx="276" cy="138" r="11" fill="#5A4636"/>
  <circle cx="280" cy="134" r="4" fill="#FFFFFF"/>
  <ellipse cx="290" cy="170" rx="12" ry="8" fill="#F2A9B0" opacity="0.85"/>
  <!-- むねの もよう(木彫りっぽさ) -->
  <g fill="none" stroke="#C9B494" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M206 236 q10 8 20 0 q10 8 20 0"/><path d="M212 262 q10 8 20 0 q10 8 20 0"/>
  </g>
</svg>
