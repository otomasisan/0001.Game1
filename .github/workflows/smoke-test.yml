name: Smoke test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.3-stable
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
      - name: Import project
        run: ./godot --headless --path . --import || true
      - name: Play chapters 1-3 end to end
        run: ./godot --headless --path . res://tests/smoke_test.tscn
      - name: Play with real mouse clicks (title -> chapters 1, 2 and 3)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./godot --path . --rendering-driver opengl3 --resolution 1920x1080 res://tests/click_test.tscn
